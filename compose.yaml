name: rehla

x-backend-environment: &backend-environment
  REHLA_ENV: local
  REHLA_DATABASE_URL: postgres://rehla:${POSTGRES_PASSWORD:-rehla_local_only}@postgres:5432/${POSTGRES_DB:-rehla}?sslmode=disable
  REHLA_LOG_FORMAT: json

services:
  postgres:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rehla}
      POSTGRES_USER: ${POSTGRES_USER:-rehla}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rehla_local_only}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rehla} -d ${POSTGRES_DB:-rehla}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:8.2.6-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  minio:
    image: quay.io/minio/minio:RELEASE.2025-10-15T17-29-55Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-rehla}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-rehla_local_only_change_me}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.30.0
    environment:
      MP_MAX_MESSAGES: 1000
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    ports:
      - "1025:1025"
      - "8025:8025"
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.backend
    entrypoint: ["/usr/local/bin/migrate", "up"]
    environment: *backend-environment
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      <<: *backend-environment
      REHLA_HTTP_ADDR: :8080
      REHLA_ALLOWED_ORIGINS: http://localhost:3000
    ports:
      - "8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    entrypoint: ["/usr/local/bin/worker"]
    environment: *backend-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  admin:
    build:
      context: .
      dockerfile: Dockerfile.admin
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8080
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  minio_data:
