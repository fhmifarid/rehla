openapi: 3.1.0
info:
  title: Rehla API
  version: 0.1.0
  description: Embedded copy of the canonical contract in backend/openapi/openapi.yaml.
paths:
  /healthz:
    get:
      operationId: getHealth
      responses:
        "200":
          description: Process is alive.
  /readyz:
    get:
      operationId: getReadiness
      responses:
        "200":
          description: Required dependencies are ready.
        "503":
          description: A required dependency is unavailable.
  /v1/system/info:
    get:
      operationId: getSystemInfo
      responses:
        "200":
          description: Safe runtime metadata.
