name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_DB: rehla_test
          POSTGRES_USER: rehla
          POSTGRES_PASSWORD: rehla_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rehla -d rehla_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      REHLA_ENV: test
      REHLA_DATABASE_URL: postgres://rehla:rehla_test_only@localhost:5432/rehla_test?sslmode=disable
      REHLA_TEST_DATABASE_URL: postgres://rehla:rehla_test_only@localhost:5432/rehla_test?sslmode=disable
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.5"
          cache-dependency-path: backend/go.sum
      - run: go mod download
      - name: Verify generated SQL
        run: |
          go run github.com/sqlc-dev/sqlc/cmd/sqlc@v1.30.0 generate
          git diff --exit-code -- internal/database/dbgen
          test -z "$(git status --porcelain -- internal/database/dbgen)"
      - name: Apply migrations twice
        run: |
          go run ./cmd/migrate up
          go run ./cmd/migrate up
          go run ./cmd/migrate status
      - run: go test -race -coverprofile=coverage.out ./...
      - run: go vet ./...
      - run: go install honnef.co/go/tools/cmd/staticcheck@latest
      - run: staticcheck ./...
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...
      - run: go build ./cmd/api ./cmd/worker ./cmd/migrate

  admin:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24.18.0"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build --workspace=@rehla/admin
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8080

  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Build backend image
        run: docker build -f Dockerfile.backend .
      - name: Build admin image
        run: docker build -f Dockerfile.admin .

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
